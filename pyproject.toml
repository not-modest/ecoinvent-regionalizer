[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecoinvent-regionalizer"
version = "0.1.0"
description = "Regionalize a single-geography ecoinvent activity by substituting each input flow's geography, using a ranked priority list, and compare LCIA results before/after."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Prasham Mehta" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "bw2data>=4,<5",
    "bw2io>=0.9,<1",
    "bw2calc>=2,<3",
    "bw2analyzer",
    "PyQt6",
    "pandas",
    "matplotlib",
    "mplcursors",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
ecoinvent-regionalizer = "ecoinvent_regionalizer.main:main"

[project.urls]
Homepage = "https://github.com/not-modest/ecoinvent-regionalizer"

[tool.hatch.build.targets.wheel]
packages = ["ecoinvent_regionalizer"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Fixture data is written as dense one-line dicts for readability as
# synthetic LCA datasets -- wrapping them doesn't help legibility.
"tests/conftest.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
